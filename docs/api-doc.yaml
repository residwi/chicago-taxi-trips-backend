openapi: 3.0.3
info:
  title: Chicago Taxi Trips API
  version: 1.0.0
  description: Chicago Taxi Trips API

servers:
  - url: http://localhost:8080

paths:
  /total_trips:
    get:
      description: Get total trips per day in the date range
      parameters:
        - name: start
          in: query
          description: "start date of the trips to fetch (format: YYYY-MM-DD)"
          required: true
          example: 2020-01-01
          schema:
            type: string
        - name: end
          in: query
          description: "end date of the trips to fetch (format: YYYY-MM-DD)"
          required: true
          example: 2020-01-02
          schema:
            type: string
      responses:
        "200":
          description: Success get a list of total trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: 2020-01-01
                        total_trips:
                          type: integer
                          example: 100
        "400":
          description: Invalid start date or end date query params

  /average_fare_heatmap:
    get:
      description: Get average fare heatmap
      parameters:
        - name: date
          in: query
          description: "date of the average fare heatmap to fetch (format: YYYY-MM-DD)"
          required: true
          example: 2020-01-01
          schema:
            type: string
      responses:
        "200":
          description: Success get average fare heatmap per pick up location S2 ID at level 16
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        s2id:
                          type: string
                          example: 880e2caa1
                          description: S2 Cell ID in hex-encoded
                        fare:
                          type: number
                          format: float
                          example: 12.5
        "400":
          description: Invalid date query params

  /average_speed_24hrs:
    get:
      description: Get average speed in the past 24 hours
      parameters:
        - name: date
          in: query
          description: "date of the average speed to fetch (format: YYYY-MM-DD)"
          required: true
          example: 2020-01-01
          schema:
            type: string
      responses:
        "200":
          description: Success get average speed in the past 24 hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        average_speed:
                          type: number
                          format: float
                          example: 45.6
        "400":
          description: Invalid date query params
